name = "waypoints-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
GITHUB_REPO = "DerekHam/waypoints"
GITHUB_BRANCH = "main"
ATLAS_PATH = "public/data/atlas.json"
SITE_ORIGINS = "https://waypoints.derekhan.link,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173"
PUBLIC_ORIGIN = "https://waypoints.derekhan.link"

# KV powers route/station/timetable caching and login rate limiting.
[[kv_namespaces]]
binding = "WAYPOINTS_KV"
id = "35d52af7b8a94dc2a231ceccac8f4e2b"
